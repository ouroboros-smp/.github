name: Feature request
description: Suggest a change to a mod, fork, bot, the website, or the server.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the change you want. Security vulnerabilities do not belong here. Report those privately, as described in the [organization security policy](https://github.com/ouroboros-smp/.github/blob/main/SECURITY.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should we do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, if any.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Minecraft or mod version
      description: Include a version only when the request depends on one.
      placeholder: "1.21.1, or the mod version"
    validations:
      required: false
